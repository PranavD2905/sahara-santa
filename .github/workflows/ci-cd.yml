# CI/CD for Sahara Santa. Setup: docs/DEPLOYMENT.md
#
#   every PR and push to main  -> checks (lint, typecheck, tests, build)
#   PR from this repo          -> Vercel Preview deployment (URL in the job summary)
#   push to main               -> Vercel Production deployment (migrates the DB first)
#
# Vercel builds remotely (scripts/vercel-build.sh) because Secret env vars
# like DATABASE_URL can't be pulled into Actions. Vercel's own Git
# auto-deploy is disabled in vercel.json, so deploys only happen here,
# after the checks pass.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel a production deploy halfway; PR runs can be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.vercel.outputs.configured }}
    steps:
      # Deploy jobs skip (instead of failing) until the Vercel secrets exist.
      - id: vercel
        run: echo "configured=${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests use PGlite (in-process Postgres): no database service needed.
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Build-only placeholders; real values live in Vercel.
          BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-0123456789
          BETTER_AUTH_URL: http://localhost:3000

  preview:
    name: Deploy preview
    needs: checks
    # Secrets aren't available to PRs from forks.
    if: needs.checks.outputs.vercel == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - id: deploy
        # Builds on Vercel with the Preview env. Preview migrates only when
        # MIGRATE_PREVIEW_DB=true is set in Vercel (its own database).
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy production
    needs: checks
    if: needs.checks.outputs.vercel == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - id: deploy
        # Builds on Vercel: scripts/vercel-build.sh runs `drizzle-kit migrate`
        # (tracked and additive, safe to re-run) and then `next build`.
        run: |
          url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployed: $url" >> "$GITHUB_STEP_SUMMARY"
