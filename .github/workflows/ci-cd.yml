# CI/CD for Sahara Santa. Setup: docs/DEPLOYMENT.md
#
#   every PR and push to main  -> checks (lint, typecheck, tests, build)
#   PR from this repo          -> Vercel Preview deployment (URL in the job summary)
#   push to main               -> DB migrations, then Vercel Production deployment
#
# Vercel's own Git auto-deploy is disabled in vercel.json so deploys only
# happen here, after the checks pass.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel a production deploy halfway; PR runs can be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.vercel.outputs.configured }}
    steps:
      # Deploy jobs skip (instead of failing) until the Vercel secrets exist.
      - id: vercel
        run: echo "configured=${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests use PGlite (in-process Postgres): no database service needed.
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Build-only placeholders; real values live in Vercel.
          BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-0123456789
          BETTER_AUTH_URL: http://localhost:3000

  preview:
    name: Deploy preview
    needs: checks
    # Secrets aren't available to PRs from forks.
    if: needs.checks.outputs.vercel == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest
      - name: Pull Vercel preview settings and env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Migrate preview database
        # Only when Preview has its OWN database (e.g. a Neon branch). Never
        # let a PR migrate production: enable via repo variable once separate.
        if: vars.MIGRATE_PREVIEW_DB == 'true'
        run: |
          set -a; source .vercel/.env.preview.local; set +a
          npm run db:migrate
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy production
    needs: checks
    if: needs.checks.outputs.vercel == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest
      - name: Pull Vercel production settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Migrate production database
        # Drizzle migrations are additive and tracked, so re-running is safe.
        run: |
          set -a; source .vercel/.env.production.local; set +a
          npm run db:migrate
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployed: $url" >> "$GITHUB_STEP_SUMMARY"
